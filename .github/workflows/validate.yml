name: Validate source plugins
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check catalog, manifests and fixtures
        run: python3 -I check_addon.py --strict
